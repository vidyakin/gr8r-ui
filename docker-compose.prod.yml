# Прод-развёртывание на VPS: postgres, migrate (миграции при каждом старте), api, worker, web (nginx), caddy (HTTPS), backup (pg_dump раз в сутки).
# Инструкция — README, «Деплой», устройство — docs/architecture/deploy.md.
#   cp .env.prod.example .env.prod && nano .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Наружу открыты только 80/443 (Caddy). Postgres и API портов на хосте не публикуют.

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: gr8r
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: '1'
  FILE_MAX_BYTES: ${FILE_MAX_BYTES:-52428800}
  STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}

x-db-env: &db-env
  ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}@postgres:5432/gr8r
  DATABASE_URL: postgres://gr8r_app:${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD}@postgres:5432/gr8r
  APP_DB_USER: gr8r_app
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gr8r
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gr8r']
      interval: 3s
      timeout: 3s
      retries: 20

  # Хранилище вложений (docs/architecture/attachments.md). Порты наружу не публикуются: файлы отдаёт только API.
  # Данные — том miniodata; в бэкап (раздел «Бэкап» в deploy.md) он не входит, копируйте отдельно.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z # на Docker Hub образы MinIO больше не публикуются
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Разовая задача при каждом запуске: бакет вложений (идемпотентно)
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z # mc входит в образ сервера
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" && mc mb --ignore-existing local/gr8r
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'

  # Разовая задача при каждом `up`: миграции (идемпотентно), роли gr8r_app/gr8r_ddl. Через неё же запускается CLI оператора:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate bun run tenant list
  migrate:
    build: { context: ., target: migrate }
    environment:
      <<: *db-env
      DDL_DB_USER: gr8r_ddl
      DDL_DB_PASSWORD: ${DDL_DB_PASSWORD:?задайте DDL_DB_PASSWORD}
      SEED: '0'
    volumes:
      - ./archives:/archives # выгрузки арендаторов: bun run tenant export <адрес> --out /archives/x.jsonl.gz
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      API_PORT: 3000
      COOKIE_SECURE: '1'
      TRUST_PROXY: '1' # Caddy → nginx → api: первый адрес X-Forwarded-For ставит Caddy
      CORS_ORIGINS: https://${DOMAIN:?задайте DOMAIN}
      SECRETS_KEY: ${SECRETS_KEY:?задайте SECRETS_KEY (openssl rand -hex 32)}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      DATABASE_URL_DDL: postgres://gr8r_ddl:${DDL_DB_PASSWORD}@postgres:5432/gr8r
      SECRETS_KEY: ${SECRETS_KEY}
      OPERATOR_LEAD_HOOK_URL: ${OPERATOR_LEAD_HOOK_URL:-}
      # Свои серверы маршрутизации оператора (задача 1213, профиль routing ниже): http://osrm:5000, http://vroom:3000. Пусто — только адреса арендаторов
      ROUTING_OSRM_URL: ${ROUTING_OSRM_URL:-}
      ROUTING_VROOM_URL: ${ROUTING_VROOM_URL:-}
      ROUTING_NOMINATIM_URL: ${ROUTING_NOMINATIM_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  # Необязательно (задача 1213): OSRM + VROOM для маршрутов на своём сервере. Запуск: --profile routing; в .env.prod задать
  # ROUTING_OSRM_URL=http://osrm:5000 и ROUTING_VROOM_URL=http://vroom:3000. Данные OSRM готовит оператор один раз (docs/architecture/routing.md):
  # ./osrm/region.osm.pbf → osrm-extract / osrm-partition / osrm-customize в ./osrm. Наружу порты не публикуются.
  # Образы и команды собраны по документации проектов, на живом сервере не проверялись.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    profiles: [routing]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 500 /data/region.osrm
    volumes:
      - ./osrm:/data:ro
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./vroom-conf:/conf
    depends_on:
      - osrm

  # Аналитика активности (docs/architecture/analytics.md): Umami со своей базой umami в этом же Postgres, данные наружу не уходят.
  # Разовая задача при каждом запуске: роль и база umami (идемпотентно, работает и на уже существующем томе)
  umami-init:
    image: postgres:16-alpine
    entrypoint: ['/bin/sh', '/umami-init.sh']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?задайте UMAMI_DB_PASSWORD (openssl rand -hex 24)}
    volumes:
      - ./docker/umami-init.sh:/umami-init.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # Трекер доступен приложению через nginx (/stats/), панель — https://${UMAMI_DOMAIN} через Caddy
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0 # версию закрепляем: обновление — осознанно, с чтением changelog
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?задайте UMAMI_DB_PASSWORD (openssl rand -hex 24)}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?задайте UMAMI_APP_SECRET (openssl rand -hex 32)}
      TRACKER_SCRIPT_NAME: m.js
      COLLECT_API_ENDPOINT: /api/m
      DISABLE_TELEMETRY: '1'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      umami-init: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-} # ID сайта из панели Umami: включает трекер без пересборки
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-stats.${DOMAIN}}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Полный дамп БД раз в сутки в ./backups, хранится BACKUP_KEEP_DAYS дней. Восстановление — README, «Деплой»
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/gr8r-$$(date +%Y%m%d-%H%M).dump
          pg_dump -h postgres -U postgres -d gr8r -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: $$f"
          find /backups -name 'gr8r-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
