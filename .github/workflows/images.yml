# Образы стека (api, worker, migrate, web) собираются здесь, а не на сервере: VDS только скачивает их из ghcr.io.
# После публикации — деплой compose в Dokploy через API (секреты ниже). Инструкция — README, «Деплой через Dokploy».
#   Секреты репозитория: DOKPLOY_URL (https://dokploy.example.com), DOKPLOY_API_KEY, DOKPLOY_COMPOSE_ID.
#   Без них образы публикуются, а деплой пропускается.
name: images

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/worker/**
      - apps/web/**
      - packages/**
      - docs/user/**
      - docker/**
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - bunfig.toml
      - tsconfig.base.json
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Префикс образов
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/futureerp" >> "$GITHUB_OUTPUT"

      # Один job и общий кэш: стадия base (bun install + код) собирается один раз на все четыре цели
      - name: migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.prefix }}-migrate:latest,${{ steps.img.outputs.prefix }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=stack
          cache-to: type=gha,scope=stack,mode=max
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.prefix }}-api:latest,${{ steps.img.outputs.prefix }}-api:${{ github.sha }}
          cache-from: type=gha,scope=stack
      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.prefix }}-worker:latest,${{ steps.img.outputs.prefix }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=stack
          cache-to: type=gha,scope=worker,mode=max
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.prefix }}-web:latest,${{ steps.img.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=stack
          cache-to: type=gha,scope=web,mode=max

      - name: Деплой в Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Секреты Dokploy не заданы — образы опубликованы, деплой пропущен"; exit 0
          fi
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
