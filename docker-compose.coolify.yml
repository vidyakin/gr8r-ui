# Развёртывание через Coolify (Docker Compose build pack): то же, что docker-compose.prod.yml, но без Caddy —
# HTTPS и домен даёт прокси Coolify (Traefik/Caddy), он же держит 80/443 на сервере.
# В Coolify: ресурс из git-репозитория → Build Pack «Docker Compose» → путь /docker-compose.coolify.yml;
# домен указывается у сервиса web (порт 80), переменные — во вкладке Environment Variables.
# Инструкция — README, «Деплой через Coolify», устройство — docs/architecture/deploy.md.

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: erp
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: '1'
  FILE_MAX_BYTES: ${FILE_MAX_BYTES:-52428800}
  STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}

x-db-env: &db-env
  ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}@postgres:5432/erp
  DATABASE_URL: postgres://erp_app:${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD}@postgres:5432/erp
  APP_DB_USER: erp_app
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d erp']
      interval: 3s
      timeout: 3s
      retries: 20

  # Хранилище вложений (docs/architecture/attachments.md). Порты наружу не публикуются: файлы отдаёт только API.
  # Данные — том miniodata; в бэкап (раздел «Бэкап» в deploy.md) он не входит, копируйте отдельно.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z # на Docker Hub образы MinIO больше не публикуются
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Разовая задача при каждом запуске: бакет вложений (идемпотентно)
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z # mc входит в образ сервера
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" && mc mb --ignore-existing local/erp
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'
    exclude_from_hc: true # как у migrate: завершившийся контейнер Coolify не считает падением
  # Разовая задача при каждом деплое: миграции и роли erp_app/erp_ddl. Завершается — Coolify не считает это падением
  migrate:
    build: { context: ., target: migrate }
    environment:
      <<: *db-env
      DDL_DB_USER: erp_ddl
      DDL_DB_PASSWORD: ${DDL_DB_PASSWORD:?задайте DDL_DB_PASSWORD}
      SEED: '0'
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    exclude_from_hc: true # ключ Coolify (он его убирает); обычный `docker compose config` на нём ругается — это ожидаемо

  # CLI оператора — в терминале Coolify у контейнера api: bun run tenant list
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      API_PORT: 3000
      COOKIE_SECURE: '1'
      TRUST_PROXY: '1' # прокси Coolify → nginx → api: первый адрес X-Forwarded-For ставит прокси Coolify
      CORS_ORIGINS: https://${DOMAIN:?задайте DOMAIN — тот же домен, что у сервиса web}
      SECRETS_KEY: ${SECRETS_KEY:?задайте SECRETS_KEY (openssl rand -hex 32)}
    volumes:
      - ./archives:/archives # загрузка арендатора: bun run tenant import /archives/x.jsonl.gz
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      DATABASE_URL_DDL: postgres://erp_ddl:${DDL_DB_PASSWORD}@postgres:5432/erp
      SECRETS_KEY: ${SECRETS_KEY}
      OPERATOR_LEAD_HOOK_URL: ${OPERATOR_LEAD_HOOK_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  # Аналитика активности (docs/architecture/analytics.md): Umami со своей базой umami в этом же Postgres, данные наружу не уходят.
  # Разовая задача при каждом запуске: роль и база umami (идемпотентно, работает и на уже существующем томе)
  umami-init:
    image: postgres:16-alpine
    entrypoint: ['/bin/sh', '/umami-init.sh']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?задайте UMAMI_DB_PASSWORD (openssl rand -hex 24)}
    volumes:
      - ./docker/umami-init.sh:/umami-init.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    exclude_from_hc: true # как у migrate: завершившийся контейнер Coolify не считает падением

  # Трекер доступен приложению через nginx (/stats/), панель — домен задаётся в Coolify у этого сервиса (порт 3000)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0 # версию закрепляем: обновление — осознанно, с чтением changelog
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?задайте UMAMI_DB_PASSWORD (openssl rand -hex 24)}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?задайте UMAMI_APP_SECRET (openssl rand -hex 32)}
      TRACKER_SCRIPT_NAME: m.js
      COLLECT_API_ENDPOINT: /api/m
      DISABLE_TELEMETRY: '1'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      umami-init: { condition: service_completed_successfully }

  # Домен у web: статика и прокси /api + WebSocket на api, /stats/ на umami
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-} # ID сайта из панели Umami: включает трекер без пересборки
    expose:
      - '80'
    depends_on:
      - api

  # Полный дамп БД раз в сутки, хранится BACKUP_KEEP_DAYS дней. Папка на сервере — каталог приложения Coolify
  # (/data/coolify/applications/<uuid>/backups)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/erp-$$(date +%Y%m%d-%H%M).dump
          pg_dump -h postgres -U postgres -d erp -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: $$f"
          find /backups -name 'erp-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
