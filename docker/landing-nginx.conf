# Лендинг (apps/landing, Astro): только статика, API не проксируется — форма заявки шлёт на полный адрес
# вебхука приложения (VITE_LEAD_FORM_URL при сборке). TLS снимает внешний прокси (Traefik Dokploy).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off; # редирект /privacy → /privacy/ без http:// и порта контейнера (TLS снимает Traefik)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Файлы сборки с хэшем в имени — кэшируются навсегда
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Страницы Astro: /docs/x → /docs/x/index.html
  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
