server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log combined if=$log_without_supplier_token;
  absolute_redirect off; # редирект /privacy → /privacy/ без http:// и порта контейнера (TLS снимает внешний прокси)

  if ($host = "future-erp.ai-solutions-studio.ru") {
    return 301 https://future-erp.ru$request_uri;
  }

  # Сжатие: основной бандл ~4,6 МБ → ~1,2 МБ по сети. Traefik Dokploy сам не сжимает, Caddy (prod-compose) не сожмёт повторно.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/plain application/javascript text/javascript application/json application/manifest+json application/wasm image/svg+xml font/ttf font/otf;

  # Заголовки безопасности. add_header в location отменяет заголовки уровня server, поэтому общий набор
  # повторён в каждом location. HSTS отдаём отсюда: TLS снимает внешний прокси (Caddy или Coolify), браузер видит https.
  # CSP — только у приложения: скрипты только свои (хранимый XSS не выполнится), шрифты Google, картинки https
  # (картинки товаров, печать и подписи в печатных формах), фреймы чужих сайтов запрещены. У ответов API свой CSP
  # (печатные формы — default-src 'none').

  # API и WebSocket на том же origin: cookie сессии работает без CORS. /api/x → http://api:3000/x
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    client_max_body_size 55m; # загрузка вложений: FILE_MAX_BYTES (50 МБ) + поля формы

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Аналитика Umami на том же origin (CSP остаётся 'self'): /stats/x → http://umami:3000/x. Адрес через переменную и resolver —
  # nginx стартует, даже если сервиса umami нет (тогда 502 только на /stats/). Скрипт и точка сбора названы нейтрально
  # (TRACKER_SCRIPT_NAME, COLLECT_API_ENDPOINT в compose), чтобы адреса не резали блокировщики.
  location /stats/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $umami_upstream http://umami:3000;
    rewrite ^/stats/(.*)$ /$1 break;
    proxy_pass $umami_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Рантайм-конфиг веба (docker/web-config.sh): без кэша, чтобы смена UMAMI_WEBSITE_ID действовала сразу после перезапуска
  location = /app {
    return 301 /app/;
  }

  location = /app/config.js {
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /app/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  }

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /widget/ {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # Лендинг (Astro): /, /blog/, /modules/, /en/, /es/, /sitemap.xml, /robots.txt
  location / {
    try_files $uri $uri/ $uri.html =404;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Ссылка поставщика содержит секрет в пути запроса.
map $uri $log_without_supplier_token {
  ~^/api/public/supplier/ 0;
  default 1;
}
