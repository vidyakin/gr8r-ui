server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Заголовки безопасности. add_header в location отменяет заголовки уровня server, поэтому общий набор
  # повторён в каждом location. HSTS отдаём отсюда: TLS снимает внешний прокси (Caddy или Coolify), браузер видит https.
  # CSP — только у приложения: скрипты только свои (хранимый XSS не выполнится), шрифты Google, картинки https
  # (картинки товаров, печать и подписи в печатных формах), фреймы чужих сайтов запрещены. У ответов API свой CSP
  # (печатные формы — default-src 'none').

  # API и WebSocket на том же origin: cookie сессии работает без CORS. /api/x → http://api:3000/x
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    client_max_body_size 55m; # загрузка вложений: FILE_MAX_BYTES (50 МБ) + поля формы

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  location / {
    try_files $uri $uri/ /index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
